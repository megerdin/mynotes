<!DOCTYPE html>

<html lang="en-GB"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#1769aa" name="theme-color"/><title>CCNA Study Notes Reader</title><style>
:root{--bg:#f4f5f7;--paper:#fff;--text:#17202a;--muted:#667085;--accent:#1769aa;--border:#d9dee5;--toolbar:#ffffffee;--code:#f1f3f5;--shadow:0 2px 12px #00000018;--font:17px;--lh:1.48}
[data-theme="dark"]{--bg:#101317;--paper:#171b21;--text:#e7eaf0;--muted:#9aa4b2;--accent:#66b3ff;--border:#303844;--toolbar:#171b21ee;--code:#0d1117;--shadow:0 2px 14px #00000055}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;min-height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#toolbar{height:58px;transition:transform .22s ease,opacity .22s ease;background:var(--toolbar);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:7px;padding:7px 10px;position:absolute;top:0;left:0;right:0;z-index:20;box-shadow:var(--shadow)}
button,input{font:inherit}button{border:1px solid var(--border);background:var(--paper);color:var(--text);border-radius:8px;padding:7px 10px;cursor:pointer}button:active{transform:scale(.98)}
#reader{height:100vh;height:100dvh;min-height:0;overflow-x:hidden;overflow-y:hidden;position:relative;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
#pages{height:100%;min-height:0;column-width:calc(100vw - 36px);column-gap:36px;column-fill:auto;padding:18px 18px 10px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,"Liberation Mono","Noto Sans Mono",monospace;font-size:var(--font);line-height:var(--lh);white-space:pre-wrap;word-break:normal;overflow:visible}
#pages>*{max-width:100%}#pages{overflow:visible}#pages{background:var(--paper);box-shadow:var(--shadow)}
#pages b,strong{font-weight:750;color:var(--text)}#pages a{color:var(--accent)}#pages pre{white-space:pre-wrap;font:inherit;margin:0}#pages code{font:inherit}
#pages font{color:inherit}#pages img{max-width:100%;height:auto}#pages table{max-width:100%;border-collapse:collapse}
#pages mark{background:#ffe58f;color:#111} .sep{color:var(--muted)}
#pageInfo{margin-left:auto;white-space:nowrap;color:var(--muted);font-size:14px}#jump{width:72px;padding:7px 8px;text-align:center}
#searchBox{display:none;position:absolute;right:10px;top:62px;background:var(--paper);border:1px solid var(--border);padding:10px;border-radius:10px;box-shadow:var(--shadow);z-index:30}.search-row{display:flex;gap:6px;align-items:center}.search-row input{width:230px;padding:8px;border:1px solid var(--border);border-radius:7px;background:var(--paper);color:var(--text)}.search-row button{padding:6px 9px}.search-status{font-size:12px;opacity:.75;margin-top:6px;min-height:16px}
#toolbar.nav-hidden{transform:translateY(-110%);opacity:0;pointer-events:none}
body.nav-hidden #reader{height:100dvh !important}
#progress{position:absolute;left:0;bottom:-2px;height:2px;background:var(--accent);width:0;z-index:30}
@media(max-width:600px){#toolbar{height:52px;padding:6px;gap:5px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}#toolbar::-webkit-scrollbar{display:none}#toolbar button{padding:6px 8px}#reader{height:100vh;height:100dvh;min-height:0}#pages{column-width:calc(100vw - 18px);column-gap:18px;padding:15px 9px 10px;font-size:var(--font);line-height:1.43}#pageInfo{font-size:12px}.desktopOnly{display:none}#jump{width:58px}}
@supports (height: 100svh){#reader{height:100svh;height:100dvh} }
@media(max-width:600px){@supports (height: 100svh){#reader{height:100svh;height:100dvh}}}

/* V9 semantic content formatting: pagination geometry remains V7. */
#pages.content p.sub-bullet{margin:.06em 0 .06em 1.15em;padding-left:.15em;font-size:.96em}
#pages.content p.arrow-bullet{font-weight:600}

#pages.content{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:var(--font);line-height:1.48;white-space:normal;word-break:normal;overflow:visible}
#pages.content p{margin:0 0 .38em 0}
#pages.content p.bullet{margin:.12em 0 .12em 0;padding-left:.15em}
#pages.content h2,#pages.content h3{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;break-after:avoid-column;column-break-after:avoid;font-weight:750;line-height:1.22;margin:.55em 0 .28em;color:var(--text)}
#pages.content h2{font-size:1.12em}#pages.content h3{font-size:1.03em}
#pages.content .section-rule{height:1px;line-height:1px;color:var(--border);margin:.25em 0 .45em;overflow:hidden}
#pages.content .code-block,#pages.content .diagram{display:block;box-sizing:border-box;width:100%;max-width:100%;margin:.45em 0 .55em;padding:.65em .7em;border:1px solid var(--border);border-radius:8px;background:var(--code);font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,"Liberation Mono","Noto Sans Mono",monospace;font-size:clamp(10px, 1.9vw, 13px);line-height:1.35;white-space:pre;overflow-x:auto;overflow-y:hidden;break-inside:avoid-column;column-break-inside:avoid;color:var(--text);tab-size:4}
#pages.content .diagram{font-size:var(--diagram-size,12px);line-height:1.15;text-align:left;padding:.55em .35em}
@media(max-width:600px){#pages.content{font-size:var(--font);line-height:1.43}#pages.content p{margin-bottom:.32em}#pages.content h2{font-size:1.06em;margin:.42em 0 .24em}#pages.content h3{font-size:1em;margin:.38em 0 .22em}#pages.content .code-block{font-size:11px;padding:.55em .55em;line-height:1.32}#pages.content .diagram{font-size:var(--diagram-size,9px);line-height:1.08;padding:.45em .2em}}

#pages.content .ccna-index{margin:0 0 1em 0;padding:.7em .75em;border:1px solid var(--border);border-radius:10px;background:var(--paper);break-inside:avoid-column;break-after:column;column-span:none}
#pages.content .ccna-index h2{margin:.05em 0 .3em}
#pages.content .ccna-index p{color:var(--muted);margin:0 0 .5em}
#pages.content .index-chapter{margin:.45em 0 .7em;break-inside:avoid}
#pages.content .index-link{font-weight:750;text-decoration:none;color:var(--accent);font-size:1.03em}
#pages.content .index-chapter ul{margin:.18em 0 0 1.2em;padding:0}
#pages.content .index-chapter li{margin:.08em 0;font-size:.92em;line-height:1.35}
#pages.content .ccna-index a{touch-action:manipulation}#pages.content .index-sub-link{color:var(--muted);text-decoration:none}#pages.content .index-sub-link:hover{text-decoration:underline;color:var(--accent)}

#toolbar{position:absolute}
#homeBtn{position:absolute;left:50%;transform:translateX(-50%);font-size:18px;font-weight:700;min-width:40px;z-index:2}
#homeBtn:hover{color:var(--accent)}
@media(max-width:600px){#homeBtn{min-width:38px;font-size:18px}}

pre.ascii-diagram {white-space: pre;overflow-x: auto;overflow-y: hidden;word-break: normal;overflow-wrap: normal;tab-size: 4;font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;line-height: 1.15;max-width: 100%;box-sizing: border-box;break-inside: avoid;page-break-inside: avoid;-webkit-overflow-scrolling: touch}
@media (max-width: 700px) {pre.ascii-diagram {font-size: 11px}}

#githubPanel{display:none;position:fixed;z-index:40;left:50%;top:72px;transform:translateX(-50%);width:min(520px,calc(100vw - 24px));background:var(--paper);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:var(--shadow)}
#githubPanel.open{display:block}
#githubPanel h3{margin:0 0 10px;font-size:17px}
#githubPanel label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px}
#githubPanel input{width:100%;box-sizing:border-box;padding:8px 9px;border:1px solid var(--border);border-radius:7px;background:var(--bg);color:var(--text)}
#githubPanel .gh-row{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
#githubPanel button{padding:7px 10px;border:1px solid var(--border);border-radius:7px;background:var(--paper);color:var(--text);cursor:pointer}
#githubPanel button:disabled{opacity:.55;cursor:wait}
#githubPanel .gh-status{margin-top:9px;font-size:12px;color:var(--muted);min-height:16px}
</style><style>
.flow-row {display: flex;align-items: baseline;width: max-content;max-width: 100%;white-space: pre;margin: 0;padding: 0;line-height: 1.25;break-inside: avoid}
.flow-branch {white-space: pre;flex: 0 0 auto;font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}
.flow-text {white-space: pre-wrap;font-family: inherit}
.flow-code {white-space: pre;font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size: inherit}
@media (max-width: 700px) {.flow-row { max-width: 100%; }}
</style><style>
.compact-rule-heading {display: inline-block !important;width: fit-content !important;max-width: 100%;border-bottom: 1px solid currentColor;padding-bottom: 0.12em;margin-bottom: 0.28em}
</style><style id="editorStyles">
#editBtn{font-weight:700}
#editPanel{display:none;position:fixed;z-index:30;left:50%;transform:translateX(-50%);top:58px;background:var(--toolbar);border:1px solid var(--border);border-radius:10px;padding:6px;box-shadow:var(--shadow);gap:4px;align-items:center;backdrop-filter:blur(8px)}
body.editing #editPanel{display:flex}
</style>
</head><body>
<header id="toolbar">
<button id="githubBtn" title="GitHub">GitHub</button>
<button id="prevBtn" title="Previous page">←</button>
<button id="nextBtn" title="Next page">→</button>
<input id="jump" value="1" inputmode="numeric" aria-label="Page number"/>
<span id="pageInfo">Page 1 / 1</span>
<button id="homeBtn" title="Home">⌂</button>
<button id="minusBtn" title="Decrease font">A−</button><span id="fontSize">17</span><button id="plusBtn" title="Increase font">A+</button>
<button id="searchBtn" title="Search">⌕</button><button id="themeBtn" title="Toggle theme">☾</button><button id="editBtn" title="Edit">✎</button>
</header>
<div id="editPanel">
<button id="boldBtn"><b>B</b></button><button id="underlineBtn"><u>U</u></button><button id="italicBtn"><i>I</i></button><button id="spaceBtn">+Space</button><button id="lineBtn">+Line</button><button id="cliBtn">CLI</button><button id="saveBtn">Save</button><button id="saveAsBtn">Save As</button><button id="openBtn">Open</button>
</div>
<div id="searchBox"><div class="search-row"><input id="searchInput" placeholder="Search"/><button id="searchPrev">↑</button><button id="searchNext">↓</button><button id="searchClose">×</button></div><div id="searchStatus" class="search-status"></div></div>
<div id="githubPanel">
<h3>GitHub Connection — V3</h3>
<label>Repository owner</label><input id="ghOwner" placeholder="username or organisation"/>
<label>Repository</label><input id="ghRepo" placeholder="repository-name"/>
<label>Branch</label><input id="ghBranch" value="main"/>
<label>Test file path (optional)</label><input id="ghPath" placeholder="notes/CCNA_Study_Notes.html"/>
<label>GitHub token (not stored)</label><input id="ghToken" type="password" placeholder="fine-grained token" autocomplete="off"/>
<div class="gh-row"><button id="ghTestBtn">Test Connection</button><button id="ghOpenBtn">Open GitHub File</button><button id="ghCloseBtn">Close</button></div>
<div id="ghStatus" class="gh-status">Not connected</div>
</div>
<div id="reader"><div id="pages" class="content"></div></div>
<div id="progress"></div>
<script>
/* V70 reader/editor implementation retained; empty framework intentionally starts at 1 page. */
(function(){
'use strict';
const reader=document.getElementById('reader'), pages=document.getElementById('pages'), info=document.getElementById('pageInfo'), jump=document.getElementById('jump'), fontSize=document.getElementById('fontSize');
let page=1,total=1,font=17;
function currentPage(){return page}
function measure(){
 if(!pages.children.length){total=1;page=1;info.textContent='Page 1 / 1';return;}
 const w=pages.clientWidth||window.innerWidth; total=Math.max(1,Math.round(pages.scrollWidth/w)); if(page>total)page=total; info.textContent='Page '+page+' / '+total;
}
function go(n){measure();page=Math.max(1,Math.min(total,Number(n)||1));reader.scrollTo({left:(page-1)*reader.clientWidth,top:0,behavior:'auto'});jump.value=page;info.textContent='Page '+page+' / '+total}
window.currentPage=currentPage;window.go=go;
function fit(){measure();go(page)}
document.getElementById('prevBtn').onclick=()=>go(page-1);document.getElementById('nextBtn').onclick=()=>go(page+1);jump.onchange=()=>go(jump.value);window.addEventListener('resize',fit);
document.getElementById('minusBtn').onclick=()=>{font=Math.max(10,font-1);document.documentElement.style.setProperty('--font',font+'px');fontSize.textContent=font;fit()};
document.getElementById('plusBtn').onclick=()=>{font=Math.min(32,font+1);document.documentElement.style.setProperty('--font',font+'px');fontSize.textContent=font;fit()};
document.getElementById('themeBtn').onclick=()=>document.documentElement.toggleAttribute('data-theme');
document.getElementById('homeBtn').onclick=()=>go(1);
window.invalidateMetrics=fit;window.fitDiagrams=()=>{};window.clearSearch=()=>{};
setTimeout(()=>go(1),0);
})();
</script>
<script>
(function(){
'use strict';
const panel=document.getElementById('githubPanel'),open=document.getElementById('githubBtn'),close=document.getElementById('ghCloseBtn'),test=document.getElementById('ghTestBtn'),openFile=document.getElementById('ghOpenBtn'),status=document.getElementById('ghStatus'),owner=document.getElementById('ghOwner'),repo=document.getElementById('ghRepo'),branch=document.getElementById('ghBranch'),path=document.getElementById('ghPath'),token=document.getElementById('ghToken');
function loadConfig(){try{const c=JSON.parse(localStorage.getItem('ccnaGithubConfig')||'{}');owner.value=c.owner||'';repo.value=c.repo||'';branch.value=c.branch||'main';path.value=c.path||''}catch(e){}}
function saveConfig(){localStorage.setItem('ccnaGithubConfig',JSON.stringify({owner:owner.value.trim(),repo:repo.value.trim(),branch:branch.value.trim()||'main',path:path.value.trim()}))}
function apiUrl(){return 'https://api.github.com/repos/'+encodeURIComponent(owner.value.trim())+'/'+encodeURIComponent(repo.value.trim())}
function headers(){const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(token.value.trim())h.Authorization='Bearer '+token.value.trim();return h}
async function testConnection(){const o=owner.value.trim(),r=repo.value.trim();if(!o||!r){status.textContent='Enter repository owner and repository name';return}status.textContent='Testing connection…';try{const res=await fetch(apiUrl(),{headers:headers()}),data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||('HTTP '+res.status));saveConfig();status.textContent='Connected ✓ '+data.full_name+(data.private?' • private':' • public')}catch(e){status.textContent='Connection failed: '+e.message}}
function decodeBase64Utf8(v){const b=atob(v.replace(/\s/g,''));return new TextDecoder('utf-8').decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}
function extractDocumentContent(html){const doc=new DOMParser().parseFromString(html,'text/html');const source=doc.querySelector('#pages');if(source)return source.innerHTML;const body=doc.body;if(body){body.querySelectorAll('script').forEach(e=>e.remove());return body.innerHTML}throw new Error('The GitHub file does not contain readable HTML content')}
async function openGitHubFile(){const o=owner.value.trim(),r=repo.value.trim(),b=branch.value.trim()||'main',p=path.value.trim();if(!o||!r){status.textContent='Enter repository owner and repository name';return}if(!p){status.textContent='Enter the GitHub HTML file path';return}saveConfig();status.textContent='Opening GitHub file…';openFile.disabled=true;try{const url='https://api.github.com/repos/'+encodeURIComponent(o)+'/'+encodeURIComponent(r)+'/contents/'+p.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(b);const res=await fetch(url,{headers:headers()}),data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.message||('HTTP '+res.status));if(Array.isArray(data))throw new Error('The selected path is a directory; choose an HTML file');if(!data.content)throw new Error('GitHub returned no file content');const html=decodeBase64Utf8(data.content),content=extractDocumentContent(html);document.getElementById('pages').innerHTML=content;window.githubDocument={owner:o,repo:r,branch:b,path:p,sha:data.sha||null,name:data.name||p.split('/').pop(),html:html};if(typeof clearSearch==='function')clearSearch();if(typeof invalidateMetrics==='function')invalidateMetrics();if(typeof fitDiagrams==='function')fitDiagrams();if(typeof go==='function')go(1);status.textContent='Opened ✓ '+(data.path||p);panel.classList.remove('open')}catch(e){status.textContent='Open failed: '+e.message}finally{openFile.disabled=false}}
open.onclick=()=>{loadConfig();panel.classList.add('open');status.textContent='Not connected';owner.focus()};close.onclick=()=>panel.classList.remove('open');test.onclick=testConnection;openFile.onclick=openGitHubFile;[owner,repo,branch,path].forEach(x=>x.addEventListener('change',saveConfig));
})();
</script>
</body></html>
