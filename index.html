<script>
function fitDiagrams(){
  const available=Math.max(120, document.getElementById('reader').clientWidth-24);
  document.querySelectorAll('#pages .diagram').forEach(el=>{
    const lines=el.textContent.split('\n');
    const maxChars=Math.max(1,...lines.map(s=>s.length));
    // Approximate monospace glyph width at 0.62em. Keep diagrams readable while fitting the viewport.
    const size=Math.max(6.5,Math.min(13,available/(maxChars*0.62)));
    el.style.setProperty('--diagram-size',size.toFixed(2)+'px');
  });
}
window.addEventListener('load',()=>setTimeout(fitDiagrams,50));
window.addEventListener('resize',()=>setTimeout(fitDiagrams,80));
</script><script>
const toolbar=document.getElementById('toolbar');
let navHideTimer;
function showNavigation(){toolbar.classList.remove('nav-hidden');document.body.classList.remove('nav-hidden');clearTimeout(navHideTimer);navHideTimer=setTimeout(hideNavigation,2000)}
function hideNavigation(){if(document.activeElement && (document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='BUTTON')) return;toolbar.classList.add('nav-hidden');document.body.classList.add('nav-hidden')}
function currentPageSafe(){const w=reader?.getBoundingClientRect().width||1;return Math.max(1,Math.min(pageCount(),Math.round((reader?.scrollLeft||0)/w)+1))}
function armNavigation(){clearTimeout(navHideTimer);navHideTimer=setTimeout(hideNavigation,2000)}
// Show controls only when the user taps/clicks in the top third of the screen.
document.addEventListener('pointerdown',e=>{if(e.target.closest('#toolbar')){showNavigation();return}if(e.clientY <= window.innerHeight/3) showNavigation()},{passive:true});
toolbar.addEventListener('pointerdown',e=>{e.stopPropagation();showNavigation()});
const reader=document.getElementById('reader'), pages=document.getElementById('pages');
const pageInfo=document.getElementById('pageInfo'), jump=document.getElementById('jump');
const fontLabel=document.getElementById('fontLabel'), searchBox=document.getElementById('searchBox'), searchInput=document.getElementById('searchInput');
let fontSize=Number(localStorage.getItem('ccnaFontSize')||17);
let restoringInitialPage=true;
function setFont(n){fontSize=Math.max(13,Math.min(25,n));document.documentElement.style.setProperty('--font',fontSize+'px');fontLabel.textContent=fontSize;localStorage.setItem('ccnaFontSize',fontSize);setTimeout(()=>{invalidateMetrics();fitDiagrams();if(!restoringInitialPage) update(true)},80)}
let metricsCache=null,totalPagesCache=1,lastShownPage=0,scrollTimer=null,navUpdateTimer=null;
function invalidateMetrics(){metricsCache=null;totalPagesCache=1;}
function pageMetrics(){
  if(metricsCache) return metricsCache;
  const cs=getComputedStyle(pages);
  const columnWidth=parseFloat(cs.columnWidth)||reader.clientWidth;
  const columnGap=parseFloat(cs.columnGap)||0;
  const paddingLeft=parseFloat(cs.paddingLeft)||0;
  metricsCache={columnWidth,columnGap,paddingLeft,pitch:columnWidth+columnGap};
  return metricsCache;
}
function pageWidth(){return Math.max(1,reader.clientWidth)}
function pagePitch(){return pageMetrics().pitch}
function pageStart(n){return Math.max(0,(n-1)*pagePitch())}
function pageCount(){
  if(totalPagesCache>1) return totalPagesCache;
  const m=pageMetrics();
  totalPagesCache=Math.max(1,Math.round((reader.scrollWidth-m.paddingLeft)/m.pitch));
  return totalPagesCache;
}
function currentPage(){
  const m=pageMetrics();
  return Math.min(pageCount(),Math.max(1,Math.round(reader.scrollLeft/m.pitch)+1));
}
function update(force=false){
  if(restoringInitialPage) return;
  const p=currentPage(), total=pageCount();
  if(!force && p===lastShownPage) return;
  lastShownPage=p;
  pageInfo.textContent=`Page ${p} / ${total}`;
  jump.value=p;
  document.getElementById('progress').style.width=(p/total*100)+'%';
  localStorage.setItem('ccnaPage',p);
  // Keep the current logical page in the URL so a normal browser reload
  // returns to exactly the page the user was reading.
  const hash=`#page=${p}`;
  if(location.hash!==hash) history.replaceState(null,'',location.pathname+location.search+hash);
}
function go(n){
  n=Math.max(1,Math.min(pageCount(),Number(n)||1));
  const x=pageStart(n);
  reader.scrollTo({left:x,behavior:'smooth'});

}

  const p=currentPage(), x=pageStart(p);
  if(Math.abs(reader.scrollLeft-x)>1) reader.scrollTo({left:x,behavior:'smooth'});
  update(true);
}
function next(){go(currentPage()+1)} function prev(){go(currentPage()-1)}
reader.addEventListener('scroll',()=>{
  clearTimeout(scrollTimer);
  update();
  scrollTimer=setTimeout(snapToPage,120);
},{passive:true});
if('onscrollend' in reader) reader.addEventListener('scrollend',snapToPage,{passive:true});
window.addEventListener('resize',()=>{
  clearTimeout(navUpdateTimer);
  const saved=Number(localStorage.getItem('ccnaPage')||1);
  invalidateMetrics();
  navUpdateTimer=setTimeout(()=>{fitDiagrams();invalidateMetrics();go(saved);},180);
});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(document.body.classList.contains('editing') && e.target.closest && e.target.closest('#pages [contenteditable=\"true\"]')) return;if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();next()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();prev()}else if(e.key==='Home'){e.preventDefault();go(1)}else if(e.key==='End'){e.preventDefault();go(pageCount())}else if(e.key==='/'){e.preventDefault();toggleSearch()}});
let sx=0,sy=0;reader.addEventListener('touchstart',e=>{sx=e.changedTouches[0].screenX;sy=e.changedTouches[0].screenY},{passive:true});reader.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-sx,dy=e.changedTouches[0].screenY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?next():prev()}},{passive:true});
function toggleSearch(){searchBox.style.display=searchBox.style.display==='block'?'none':'block';if(searchBox.style.display==='block')searchInput.focus()}
document.getElementById('searchBtn').onclick=toggleSearch;
let searchMatches=[],searchIndex=-1,searchQuery='';
function clearSearch(){searchMatches=[];searchIndex=-1;searchQuery='';const st=document.getElementById('searchStatus');if(st)st.textContent='';}
function collectSearchMatches(q){
  searchMatches=[]; searchIndex=-1; searchQuery=q.toLowerCase();
  const walker=document.createTreeWalker(pages,NodeFilter.SHOW_TEXT,{acceptNode:n=>{
    const el=n.parentElement;
    if(!el || el.closest('#searchBox,#toolbar')) return NodeFilter.FILTER_REJECT;
    if(!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT;
  }});
  let node;
  while(node=walker.nextNode()){
    const text=node.nodeValue.toLowerCase(); let from=0, at;

      const rects=Array.from(range.getClientRects());

<script id="editorScript">
(function(){
  const editBtn=document.getElementById('editBtn');
  const saveBtn=document.getElementById('saveBtn');
  const saveAsBtn=document.getElementById('saveAsBtn');
  const newBtn=document.getElementById('newBtn');
  const openBtn=document.getElementById('openBtn');
  const status=document.getElementById('editStatus');

  let editing=false,fileHandle=null,dirty=false,savedRange=null;
  let currentHost=null,currentNodes=[];

  function pages(){return document.getElementById('pages');}
  function reader(){return document.getElementById('reader');}

  function pageInfo(){
    const p=pages(), r=reader(), cs=getComputedStyle(p);
    const width=parseFloat(cs.columnWidth)||r.clientWidth;
    const gap=parseFloat(cs.columnGap)||0;
    const pitch=width+gap;
    const rr=p.getBoundingClientRect();
    const page=(typeof currentPage==='function')?currentPage():(typeof currentPage==='number'?currentPage:1);
    return {p,r,cs,width,gap,pitch,rr,page,index:page-1};
  }

  /*
   * V62:
   * The actual #pages element is NOT contenteditable.
   * Only the existing DOM elements rendered inside the current CSS column
   * are temporarily placed under one page-local editing host.
   *
   * No cloned visual page and no whole-document editing surface are used.
   */
  function pageNodes(){
    const q=pageInfo(), left=q.rr.left+q.index*q.pitch, right=left+q.width;
    const top=q.rr.top, bottom=q.rr.bottom;
    const nodes=Array.from(q.p.children).filter(el=>!el.closest('.ccna-index'));

    return nodes.filter(el=>{
      const rects=Array.from(el.getClientRects ? el.getClientRects():[]);
      return rects.some(x=>
        x.right>left+1 && x.left<right-1 &&
        x.bottom>top && x.top<bottom
      );
    });
  }

  function makeHost(){
    if(currentHost)return;
    const q=pageInfo();
    currentNodes=pageNodes();
    if(!currentNodes.length)return;

    currentHost=document.createElement('div');
    currentHost.id='v62-current-page-edit-host';
    currentHost.contentEditable='true';
    currentHost.spellcheck=false;

    /*
     * The host is transparent to layout: it inherits the exact typography
     * used by the reader, but is only created for the current page.
     */
    currentHost.style.cssText=
      'position:relative;'+
      'box-sizing:border-box;'+
      'width:'+q.width+'px;'+
      'min-height:100%;'+
      'margin:0;'+
      'padding:'+q.cs.paddingTop+' '+q.cs.paddingRight+' '+q.cs.paddingBottom+' '+q.cs.paddingLeft+';'+
      'font-family:'+q.cs.fontFamily+';'+
      'font-size:'+q.cs.fontSize+';'+
      'font-weight:'+q.cs.fontWeight+';'+
      'line-height:'+q.cs.lineHeight+';'+
      'letter-spacing:'+q.cs.letterSpacing+';'+
      'color:'+q.cs.color+';'+
      'background:transparent;';

    /*
     * Move the actual current-page nodes into the host rather than cloning
     * them. This preserves their identity and lets the browser make one
     * continuous selection across paragraphs.
     */
    const parent=currentNodes[0].parentNode;
    const before=currentNodes[currentNodes.length-1].nextSibling;
    parent.insertBefore(currentHost,before);
    currentNodes.forEach(n=>currentHost.appendChild(n));

    // Keep the reader's normal column container from reflowing the editor.
    currentHost.style.columnSpan='none';
  }

  function removeHost(){
    if(!currentHost)return;
    const parent=currentHost.parentNode;
    const before=currentHost.nextSibling;
    while(currentHost.firstChild)parent.insertBefore(currentHost.firstChild,before);
    currentHost.remove();
    currentHost=null;
    currentNodes=[];
  }

  function rememberSelection(){
    const sel=window.getSelection();
    if(!sel||!sel.rangeCount||sel.isCollapsed)return;
    if(currentHost && currentHost.contains(sel.anchorNode) && currentHost.contains(sel.focusNode))
      savedRange=sel.getRangeAt(0).cloneRange();
  }

  function restoreSelection(){
    if(!savedRange)return false;
    const sel=window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedRange);
    currentHost.focus();
    return true;
  }

  function markDirty(){
    dirty=true;
    status.textContent='Unsaved changes'+(fileHandle?' • file ready':' • use Save As');
  }

  function setEditing(on){
    if(on){
      editing=true;
      document.body.classList.add('editing');
      makeHost();

      if(currentHost){
        currentHost.focus();
        editBtn.textContent='✓';
        editBtn.title='Exit editing mode';
        status.textContent=fileHandle?'Editing • file selected':'Editing • choose Open to enable same-file Save';
        showNavigation();
      }else{
        editing=false;
        document.body.classList.remove('editing');
        status.textContent='Unable to identify current page';
      }
    }else{
      exitEditing();
    }
  }

  function exitEditing(){
    if(!editing)return;
    removeHost();
    savedRange=null;
    editing=false;
    document.body.classList.remove('editing');
    editBtn.textContent='✎';
    editBtn.title='Desktop editing mode';
    status.textContent='Edit mode';
    document.activeElement?.blur();
    invalidateMetrics();
    fitDiagrams();
    setTimeout(()=>update(true),80);
  }

  editBtn.onclick=()=>setEditing(!editing);

  document.addEventListener('selectionchange',()=>{if(editing)rememberSelection();});

  document.querySelectorAll('.edit-tool[data-cmd]').forEach(b=>{
    b.addEventListener('mousedown',e=>e.preventDefault());
    b.addEventListener('click',()=>{
      if(!restoreSelection())return;
      document.execCommand(b.dataset.cmd,false,null);
      rememberSelection();
      markDirty();
    });
  });

  document.getElementById('spaceBtn').onclick=()=>{
    if(!restoreSelection())return;
    document.execCommand('insertHTML',false,'<span class="edit-spacer" contenteditable="false"></span>');
    rememberSelection();markDirty();
  };

  document.getElementById('lineBtn').onclick=()=>{
    if(!restoreSelection())return;
    document.execCommand('insertHTML',false,'<hr class="manual-rule" contenteditable="false">');
    rememberSelection();markDirty();
  };

  document.getElementById('cliBtn').onclick=()=>{
    if(!restoreSelection())return;
    const sel=window.getSelection();
    if(!sel.rangeCount)return;

    const range=sel.getRangeAt(0);
    const raw=sel.toString();
    if(!raw.trim())return;

    /*
     * CLI conversion:
     * Selection can span several block elements. Browser selection text may
     * contain extra newlines because each <p>/<li>/<div> contributes its own
     * block boundary. Extract the selected DOM fragment first, then normalize
     * its actual text lines. This prevents block-boundary formatting from
     * becoming blank CLI lines.
     */
    const fragment=range.cloneContents();
    const holder=document.createElement('div');
    holder.appendChild(fragment);

    let lines=[];
    const blockTags=new Set(['P','DIV','LI','H1','H2','H3','H4','H5','H6','PRE']);

    function collect(node){
      if(node.nodeType===Node.TEXT_NODE){
        const parts=node.nodeValue.replace(/\r\n/g,'\n').replace(/\r/g,'\n').split('\n');
        for(const part of parts){
          if(part.trim()!=='') lines.push(part);
        }
        return;
      }
      if(node.nodeType!==Node.ELEMENT_NODE)return;

      const isBlock=blockTags.has(node.tagName);
      if(isBlock && lines.length && lines[lines.length-1].trim()!==''){
        // A block boundary is a separator, not an empty CLI line.
      }

      for(const child of node.childNodes)collect(child);
    }

    collect(holder);

    // The recursive extraction above can split a single text node correctly,
    // but adjacent block elements need explicit text joining without blank
    // separators. Build the final CLI payload from non-empty trimmed lines.
    const payload=lines.map(line=>line.replace(/[ \t]+$/,'')).filter(line=>line.trim()!=='').join('\n');

    if(!payload)return;

    const pre=document.createElement('pre');
    pre.className='code-block';
    pre.contentEditable='true';
    pre.spellcheck=false;
    pre.textContent=payload;

    range.deleteContents();
    range.insertNode(pre);

    sel.removeAllRanges();
    const nr=document.createRange();
    nr.selectNodeContents(pre);
    sel.addRange(nr);
    savedRange=nr.cloneRange();
    markDirty();
  };

  document.addEventListener('input',e=>{
    if(editing && currentHost && currentHost.contains(e.target))markDirty();
  });

  // Plain-text editing: force Enter to insert a literal newline character.
  // This prevents Chromium from converting Enter into <div>/<br> structure,
  // which cannot be serialized back to exact plain text reliably.
  document.addEventListener('keydown',e=>{
    if(!editing || e.key!=='Enter' || !currentHost)return;
    const sel=window.getSelection();
    if(!sel || !sel.rangeCount)return;
    const range=sel.getRangeAt(0);
    const pre=(sel.anchorNode && sel.anchorNode.nodeType===1)
      ? sel.anchorNode.closest('pre.github-plain-text')
      : sel.anchorNode?.parentElement?.closest('pre.github-plain-text');
    if(!pre || !currentHost.contains(pre) || !currentHost.contains(range.commonAncestorContainer))return;

    e.preventDefault();
    e.stopImmediatePropagation();
    range.deleteContents();
    const node=document.createTextNode('\n');
    range.insertNode(node);
    range.setStartAfter(node);
    range.collapse(true);
    sel.removeAllRanges();
    sel.addRange(range);
    markDirty();
  },true);

  document.addEventListener('keydown',e=>{
    if(!editing)return;
    if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){
      e.preventDefault();
      e.stopImmediatePropagation();
      saveCurrent();
    }
  },true);

  async function ensureHandle(){
    if(fileHandle)return true;
    if(!window.showOpenFilePicker){
      status.textContent='Same-file Save is unavailable here; use Save As or run the HTML from a local web server';
      return false;
    }
    try{
      const [h]=await window.showOpenFilePicker({
        multiple:false,
        types:[{description:'CCNA HTML',accept:{'text/html':['.html','.htm']}}]
      });
      fileHandle=h;
      status.textContent='File selected • Save writes to this file';
      return true;
    }catch(e){return false;}
  }

  function cleanClone(){
    // Move the current-page nodes back before serialization. This ensures the
    // saved HTML has exactly the same document structure as the reader.
    const wasEditing=editing;
    if(wasEditing)removeHost();

    const clone=document.documentElement.cloneNode(true);
    clone.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
    clone.querySelectorAll('[spellcheck]').forEach(x=>x.removeAttribute('spellcheck'));
    clone.querySelector('body')?.classList.remove('editing');
    clone.querySelector('#pages')?.removeAttribute('contenteditable');

    if(wasEditing)makeHost();

    return '<!DOCTYPE html>\n'+clone.outerHTML;
  }

  async function saveToHandle(){
    const html=cleanClone();

    if(location.protocol==='http:'&&(location.hostname==='127.0.0.1'||location.hostname==='localhost')){
      try{
        const name=decodeURIComponent(location.pathname.split('/').pop()||'CCNA_Study_Notes_Reader_v62.html');
        const r=await fetch('/__save?file='+encodeURIComponent(name),{
          method:'POST',
          headers:{'Content-Type':'text/html;charset=utf-8'},
          body:html
        });
        if(!r.ok)throw new Error(await r.text()||('HTTP '+r.status));
        dirty=false;
        status.textContent='Saved ✓ '+new Date().toLocaleTimeString();
        return true;
      }catch(e){
        status.textContent='Save failed: '+e.message;
        return false;
      }
    }

    if(!await ensureHandle())return false;
    try{
      if(fileHandle.queryPermission&&await fileHandle.queryPermission({mode:'readwrite'})!=='granted'){
        if(!fileHandle.requestPermission||await fileHandle.requestPermission({mode:'readwrite'})!=='granted'){
          status.textContent='Write permission was not granted';
          return false;
        }
      }
      const writable=await fileHandle.createWritable();
      await writable.write(html);
      await writable.close();
      dirty=false;
      status.textContent='Saved ✓ '+new Date().toLocaleTimeString();
      return true;
    }catch(e){
      status.textContent='Save failed: '+e.message;
      return false;
    }
  }

  async function saveCurrent(){
    if(window.githubDocument && typeof window.githubSaveCurrent==='function'){
      return await window.githubSaveCurrent();
    }
    if(location.protocol==='http:'&&(location.hostname==='127.0.0.1'||location.hostname==='localhost')){
      return await saveToHandle();
    }
    if(!fileHandle){
      status.textContent='Select this HTML file with Open first';
      if(!await ensureHandle())return false;
    }
    return await saveToHandle();
  }

  async function newDocument(){
    if(dirty && !confirm('Discard unsaved changes and create a new document?'))return;

    if(editing)exitEditing();

    const p=pages();
    p.replaceChildren();

    const pre=document.createElement('pre');
    pre.className='code-block github-plain-text';
    pre.contentEditable='true';
    pre.spellcheck=false;
    pre.textContent='';
    pre.style.whiteSpace='pre';
    pre.style.overflowX='auto';
    pre.style.overflowY='visible';
    pre.style.maxWidth='100%';
    pre.style.minHeight='1.35em';
    pre.style.breakInside='auto';
    pre.style.columnBreakInside='auto';
    p.appendChild(pre);

    // A new document has no GitHub path/SHA yet. Save will create it.
    window.githubDocument={
      owner:'',repo:'',branch:'main',path:'',sha:null,
      name:'',isHtml:false,raw:''
    };
    dirty=false;
    invalidateMetrics();
    fitDiagrams();

    // Enter the same page-local editing host used by existing plain-text files.
    setTimeout(()=>{
      setEditing(true);
      if(currentHost){
        const sel=window.getSelection();
        const range=document.createRange();
        range.selectNodeContents(currentHost);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
        currentHost.focus();
      }
      status.textContent='New document • enter text, then Save';
    },80);
  }

  async function saveAs(){
    if(window.githubDocument && typeof window.githubSaveAs==='function'){
      await window.githubSaveAs();
      return;
    }

    const blob=new Blob([cleanClone()],{type:'text/html;charset=utf-8'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='CCNA_Study_Notes_edited.html';
    a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    dirty=false;
    status.textContent='Exported ✓';
  }

  saveBtn.onclick=async()=>{
    await saveCurrent();
  };

  saveAsBtn.onclick=saveAs;
  newBtn.onclick=newDocument;
  window.newDocument=newDocument;

  openBtn.onclick=async()=>{
    if(location.protocol==='http:'&&(location.hostname==='127.0.0.1'||location.hostname==='localhost')){
      status.textContent='Already editing the current file • Save writes directly to it';
      return;
    }
    await ensureHandle();
  };

  window.addEventListener('beforeunload',e=>{
    if(dirty){e.preventDefault();e.returnValue='';}
  });
})();
</script>

<script id="v70-normal-text">
(function(){
'use strict';

function convertCliToNormal(){
  if(!document.body.classList.contains('editing'))return;

  const sel=window.getSelection();
  if(!sel || sel.isCollapsed)return;

  const blocks=[];
  const seen=new Set();

  // Work from the actual selection, including selections spanning several
  // CLI blocks, without changing the existing V69 CLI implementation.
  const range=sel.getRangeAt(0);
  const root=document.getElementById('pages');
  if(!root || !root.contains(range.commonAncestorContainer))return;

  root.querySelectorAll('pre.code-block').forEach(pre=>{
    if(!seen.has(pre) && range.intersectsNode(pre)){
      seen.add(pre);
      blocks.push(pre);
    }
  });

  if(!blocks.length)return;

  blocks.forEach(pre=>{
    const p=document.createElement('p');
    p.innerHTML=pre.innerHTML;
    p.removeAttribute('contenteditable');
    pre.parentNode.insertBefore(p,pre);
    pre.remove();
  });

  if(typeof markDirty==='function')markDirty();
  if(typeof invalidateMetrics==='function')invalidateMetrics();
  if(typeof fitDiagrams==='function')fitDiagrams();
}

document.addEventListener('keydown',function(e){
  if(!document.body.classList.contains('editing'))return;
  if(!(e.ctrlKey && e.altKey) || e.key.toLowerCase()!=='n')return;

  const sel=window.getSelection();
  if(!sel || sel.isCollapsed || !sel.toString().trim())return;

  e.preventDefault();
  e.stopImmediatePropagation();
  convertCliToNormal();
},true);

})();
</script>

const token=document.getElementById('ghToken');
function loadConfig(){try{const c=JSON.parse(localStorage.getItem('ccnaGithubConfig')||'{}');owner.value=c.owner||'';repo.value=c.repo||'';branch.value=c.branch||'main';path.value=c.path||''}catch(e){}}
function saveConfig(){localStorage.setItem('ccnaGithubConfig',JSON.stringify({owner:owner.value.trim(),repo:repo.value.trim(),branch:branch.value.trim()||'main',path:path.value.trim()}))}
function apiBase(){return 'https://api.github.com/repos/'+encodeURIComponent(owner.value.trim())+'/'+encodeURIComponent(repo.value.trim())}
function headers(){const h={'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};if(token.value.trim())h.Authorization='Bearer '+token.value.trim();return h}
async function readJson(res){return await res.json().catch(()=>({}))}
async function testConnection(){const o=owner.value.trim(),r=repo.value.trim();if(!o||!r){status.textContent='Enter repository owner and repository name';return}status.textContent='Testing connection…';try{const res=await fetch(apiBase(),{headers:headers()}),data=await readJson(res);if(!res.ok)throw new Error(data.message||('HTTP '+res.status));saveConfig();status.textContent='Connected ✓ '+data.full_name+(data.private?' • private':' • public')}catch(e){status.textContent='Connection failed: '+e.message}}
function decodeBase64Utf8(v){const binary=atob(v.replace(/\s/g,''));const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
function isHtmlFile(p){return /\.(html?|xhtml)$/i.test(p)}
function parentPath(p){const a=p.split('/').filter(Boolean);a.pop();return a.join('/')}
function setBrowserPath(p){
  browserPath.textContent=p||'Repository root';
  upBtn.disabled=!p;
}
function renderBrowser(items,currentPath){
  fileList.replaceChildren();
  if(currentPath){
    const back=document.createElement('button');
    back.className='gh-file-item';
    back.textContent='↩ ..';
    back.onclick=()=>browseGitHubFiles(parentPath(currentPath));
    fileList.appendChild(back);
  }
  const sorted=[...items].sort((a,b)=>{
    if(a.type!==b.type)return a.type==='dir'?-1:1;
    return a.name.localeCompare(b.name);
  });
  if(!sorted.length){
    const empty=document.createElement('div');
    empty.className='gh-status';
    empty.style.padding='7px 9px';
    empty.textContent='Empty directory';
    fileList.appendChild(empty);
    return;
  }
  sorted.forEach(item=>{
    const b=document.createElement('button');
    b.className='gh-file-item';
    b.textContent=(item.type==='dir'?'📁 ':'📄 ')+item.name;
    b.title=item.path;
    b.onclick=()=>{
      if(item.type==='dir'){
        browseGitHubFiles(item.path);
      }else{
        path.value=item.path;
        saveConfig();
        openGitHubFile();
      }
    };
    fileList.appendChild(b);
  });
}
async function browseGitHubFiles(currentPath=''){
  const o=owner.value.trim(),r=repo.value.trim(),b=branch.value.trim()||'main';
  if(!o||!r){
    status.textContent='Enter repository owner and repository name';
    return;
  }
  saveConfig();
  status.textContent='Loading GitHub files…';
  browseBtn.disabled=true;
  upBtn.disabled=true;
  try{
    const suffix=currentPath
      ? '/contents/'+currentPath.split('/').map(encodeURIComponent).join('/')
      : '/contents';
    const url=apiBase()+suffix+'?ref='+encodeURIComponent(b);
    const res=await fetch(url,{headers:headers()});
    const data=await readJson(res);
    if(!res.ok)throw new Error(data.message||('HTTP '+res.status));
    if(!Array.isArray(data))throw new Error('Selected path is a file');
    setBrowserPath(currentPath);
    renderBrowser(data,currentPath);
    status.textContent='Files loaded ✓';
  }catch(e){
    fileList.replaceChildren();
    const err=document.createElement('div');
    err.className='gh-status';
    err.style.padding='7px 9px';
    err.textContent='Browse failed: '+e.message;
    fileList.appendChild(err);
    status.textContent='Browse failed: '+e.message;
  }finally{
    browseBtn.disabled=false;
    upBtn.disabled=!currentPath;
  }
}

function loadHtmlContent(html){const doc=new DOMParser().parseFromString(html,'text/html');const source=doc.querySelector('#pages');if(source)return source.innerHTML;const body=doc.body;if(body){body.querySelectorAll('script').forEach(e=>e.remove());return body.innerHTML}return ''}
function loadPlainText(text){const pre=document.createElement('pre');pre.className='code-block github-plain-text';pre.textContent=text;pre.style.whiteSpace='pre';pre.style.overflowX='auto';pre.style.overflowY='visible';pre.style.maxWidth='100%';pre.style.breakInside='auto';pre.style.columnBreakInside='auto';return pre}
async function openGitHubFile(){if(typeof editing!=='undefined'&&editing&&typeof exitEditing==='function')exitEditing();const o=owner.value.trim(),r=repo.value.trim(),b=branch.value.trim()||'main',p=path.value.trim();if(!o||!r){status.textContent='Enter repository owner and repository name';return}if(!p){status.textContent='Enter the GitHub file path';return}saveConfig();status.textContent='Opening GitHub file…';openFileBtn.disabled=true;try{const url=apiBase()+'/contents/'+p.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(b);const res=await fetch(url,{headers:headers()}),data=await readJson(res);if(!res.ok)throw new Error(data.message||('HTTP '+res.status));if(Array.isArray(data))throw new Error('Selected path is a directory; choose a file');if(!data.content)throw new Error('GitHub returned no file content');const raw=decodeBase64Utf8(data.content);const pages=document.getElementById('pages');pages.replaceChildren();if(isHtmlFile(p)){pages.innerHTML=loadHtmlContent(raw)}else{pages.appendChild(loadPlainText(raw))}window.githubDocument={owner:o,repo:r,branch:b,path:p,sha:data.sha||null,name:data.name||p.split('/').pop(),isHtml:isHtmlFile(p),raw:raw};if(typeof invalidateMetrics==='function')invalidateMetrics();if(typeof fitDiagrams==='function')fitDiagrams();if(typeof update==='function')update(true);if(typeof goHome==='function' && !window.location.hash){/* no-op: preserve V70 navigation */}status.textContent='Opened ✓ '+(data.path||p);const es=document.getElementById('editStatus');if(es)es.textContent='GitHub file loaded • '+(data.path||p);panel.classList.remove('open')}catch(e){status.textContent='Open failed: '+e.message}finally{openFileBtn.disabled=false}}
openBtn.addEventListener('click',()=>{loadConfig();panel.classList.add('open');status.textContent='Not connected';fileList.replaceChildren();const d=document.createElement('div');d.className='gh-status';d.style.padding='7px 9px';d.textContent='Click Browse Files';fileList.appendChild(d);setBrowserPath('');owner.focus()});
closeBtn.addEventListener('click',()=>panel.classList.remove('open'));
testBtn.addEventListener('click',testConnection);
openFileBtn.addEventListener('click',openGitHubFile);
browseBtn.addEventListener('click',()=>browseGitHubFiles(''));
upBtn.addEventListener('click',()=>browseGitHubFiles(parentPath(browserPath.textContent==='Repository root'?'':browserPath.textContent)));
[owner,repo,branch,path].forEach(x=>x.addEventListener('change',saveConfig));
})();

</script>

<script id="githubSaveV4">
(function(){
  'use strict';

  const panel=document.getElementById('githubPanel');
  const token=document.getElementById('ghToken');
  const status=document.getElementById('ghStatus');

  function headers(){
    const h={
      'Accept':'application/vnd.github+json',
      'X-GitHub-Api-Version':'2022-11-28',
      'Content-Type':'application/json'
    };
    const t=(token.value||'').trim();
    if(t)h.Authorization='Bearer '+t;
    return h;
  }

  function b64(value){
    const bytes=new TextEncoder().encode(value);
    let binary='';
    for(let i=0;i<bytes.length;i+=0x8000){
      binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
    }
    return btoa(binary);
  }

  function contentToSave(){
    const d=window.githubDocument;
    const pages=document.getElementById('pages');

    if(!d.isHtml){
      // Plain-text files are kept as literal text. Enter is handled by the
      // editor below so line breaks remain actual \n characters in the <pre>.
      const pre=pages.querySelector('pre.github-plain-text');
      if(pre){
        return pre.textContent.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
      }
      return pages.textContent;
    }

    // For HTML, preserve the original document and replace only its #pages content.
    const doc=new DOMParser().parseFromString(d.raw,'text/html');
    const sourcePages=doc.querySelector('#pages');
    if(!sourcePages)throw new Error('Original HTML file has no #pages element');

    sourcePages.innerHTML=pages.innerHTML;
    sourcePages.querySelectorAll('[contenteditable]').forEach(x=>x.removeAttribute('contenteditable'));
    sourcePages.querySelectorAll('[spellcheck]').forEach(x=>x.removeAttribute('spellcheck'));

    return '<!DOCTYPE html>\n'+doc.documentElement.outerHTML;
  }

  async function saveGitHub(){
    const d=window.githubDocument;
    if(!d){
      status.textContent='No GitHub file is open';
      return false;
    }

    // New documents have no GitHub path/SHA yet. Reuse the saved repository
    // configuration, then ask for the new path at Save time.
    if(!d.path){
      try{
        const c=JSON.parse(localStorage.getItem('ccnaGithubConfig')||'{}');
        d.owner=d.owner||c.owner||'';
        d.repo=d.repo||c.repo||'';
        d.branch=d.branch||c.branch||'main';
      }catch(e){}
      if(!d.owner||!d.repo){
        status.textContent='Enter repository owner and repository name';
        panel.classList.add('open');
        document.getElementById('ghOwner')?.focus();
        return false;
      }

      const newPath=prompt('New GitHub file path:','newfile.txt');
      if(newPath===null)return false;
      const p=newPath.trim();
      if(!p){
        status.textContent='File path cannot be empty';
        return false;
      }
      d.path=p;
      d.name=p.split('/').pop();
    }

    const t=(token.value||'').trim();
    if(!t){
      status.textContent='Enter a GitHub token with Contents write permission';
      panel.classList.add('open');
      token.focus();
      return false;
    }

    const message=prompt('GitHub commit message:','Update '+d.name);
    if(message===null)return false;

    status.textContent='Saving to GitHub…';

    try{
      const content=contentToSave();
      const url='https://api.github.com/repos/'+
        encodeURIComponent(d.owner)+'/'+encodeURIComponent(d.repo)+
        '/contents/'+d.path.split('/').map(encodeURIComponent).join('/');

      const res=await fetch(url,{
        method:'PUT',
        headers:headers(),
        body:JSON.stringify({
          message:message,
          content:b64(content),
          ...(d.sha?{sha:d.sha}:{}),
          branch:d.branch
        })
      });

      const data=await res.json().catch(()=>({}));

      if(!res.ok){
        if(res.status===409||res.status===422){
          throw new Error('GitHub rejected the update. The file may have changed; reopen it before saving.');
        }
        throw new Error(data.message||('HTTP '+res.status));
      }

      d.sha=data.content?.sha||d.sha;
      d.name=data.content?.name||d.name;
      d.raw=content;

      status.textContent='Saved to GitHub ✓';
      const editStatus=document.getElementById('editStatus');
      if(editStatus)editStatus.textContent='GitHub saved • '+d.path;
      return true;
    }catch(e){
      status.textContent='GitHub save failed: '+e.message;
      return false;
    }
  }

  async function saveGitHubAs(){
    const d=window.githubDocument;
    if(!d){
      status.textContent='No GitHub file is open';
      return false;
    }

    const t=(token.value||'').trim();
    if(!t){
      status.textContent='Enter a GitHub token with Contents write permission';
      panel.classList.add('open');
      token.focus();
      return false;
    }

    const newPath=prompt('New GitHub file path:',d.path||'newfile.txt');
    if(newPath===null)return false;
    const p=newPath.trim();
    if(!p){
      status.textContent='File path cannot be empty';
      return false;
    }
    if(d.path && p===d.path){
      status.textContent='Save As needs a different file path';
      return false;
    }

    const message=prompt('GitHub commit message:','Create '+p.split('/').pop());
    if(message===null)return false;

    status.textContent='Creating GitHub file…';

    try{
      const content=contentToSave();
      const url='https://api.github.com/repos/'+
        encodeURIComponent(d.owner)+'/'+encodeURIComponent(d.repo)+
        '/contents/'+p.split('/').map(encodeURIComponent).join('/');

      const res=await fetch(url,{
        method:'PUT',
        headers:headers(),
        body:JSON.stringify({
          message:message,
          content:b64(content),
          branch:d.branch
        })
      });

      const data=await res.json().catch(()=>({}));

      if(!res.ok){
        throw new Error(data.message||('HTTP '+res.status));
      }

      d.path=p;
      d.name=data.content?.name||p.split('/').pop();
      d.sha=data.content?.sha||null;
      d.raw=content;

      status.textContent='Created on GitHub ✓';
      const editStatus=document.getElementById('editStatus');
      if(editStatus)editStatus.textContent='GitHub file created • '+p;
      return true;
    }catch(e){
      status.textContent='GitHub Save As failed: '+e.message;
      return false;
    }
  }

  window.githubSaveCurrent=saveGitHub;
  window.githubSaveAs=saveGitHubAs;
})();
</script>
